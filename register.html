<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/png" href="images/favicon.png">
    <title>Đăng ký | Connect</title><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="css/auth.css">    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/compact-ui.css">
    <link rel="stylesheet" href="css/quality.css">
</head>
<body><main class="auth-container"><section class="auth-card"><a href="index.html" class="logo">Connect<span>.</span></a><span class="eyebrow">THAM GIA CỘNG ĐỒNG</span><h1>Tạo tài khoản</h1><p>Bắt đầu xây dựng hồ sơ Connect của bạn.</p>
<form id="registerForm"><label for="username">Tên hiển thị</label><input type="text" id="username" autocomplete="username" placeholder="Tên của bạn" minlength="3" maxlength="30" required><label for="email">Email</label><input type="email" id="email" autocomplete="email" placeholder="email@example.com" required><label for="password">Mật khẩu</label><input type="password" id="password" autocomplete="new-password" placeholder="Ít nhất 8 ký tự" minlength="8" required><label for="confirmPassword">Nhập lại mật khẩu</label><input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Nhập lại mật khẩu" minlength="8" required><button type="submit" id="registerBtn">Tạo tài khoản</button><p id="registerMessage" aria-live="polite"></p></form>
<p class="auth-footer">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p></section></main><script type="module" src="js/auth.js"></script></body></html>
