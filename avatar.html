
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Avatar Studio | Connect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .avatar-studio {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .studio-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 25px;
        }

        .avatar-preview,
        .avatar-options {
            background: var(--surface); color: var(--text);
            padding: 25px;
            border-radius: 16px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
        }

        .avatar-preview {
            text-align: center;
        }

        #avatarCanvas {
            width: min(100%, 260px);
            aspect-ratio: 1 / 1;
            height: auto;
            margin: 20px auto;
            display: block;
            border-radius: 50%;
            overflow: hidden;
            object-fit: cover;
        }

        .option-group {
            margin-bottom: 18px;
        }

        .option-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .option-group select {
            color: var(--text);
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface); color: var(--text);
        }

        .save-avatar {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #avatarMessage {
            text-align: center;
            margin-top: 12px;
        }


        .option-group { margin-bottom: 16px; }
        .swatches { display: flex; flex-wrap: wrap; gap: 9px; }
        .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; transition: transform .15s; }
        .swatch:hover { transform: scale(1.12); }
        .swatch[aria-pressed="true"] { outline: 3px solid var(--primary); outline-offset: 2px; }
        .avatar-options { max-height: 640px; overflow-y: auto; }
        .studio-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 6px 0 12px; }
        .studio-actions button { min-height: 42px; padding: 10px; border-radius: 8px; font-weight: 650; cursor: pointer; }
        .random-avatar, .secondary-avatar { border: 1px dashed var(--primary); background: transparent; color: var(--primary); }
        .secondary-avatar { border-style: solid; border-color: var(--border); color: var(--text); }
        #avatarMessage[data-type="success"] { color: #16834a; }
        #avatarMessage[data-type="error"] { color: #c43d3d; }
        .avatar-preview svg { overflow: hidden; filter: drop-shadow(0 12px 18px rgba(30, 35, 70, .18)); transform-style: preserve-3d; transition: transform .35s ease, filter .35s ease; }
        .avatar-preview svg:hover { transform: perspective(700px) rotateY(-5deg) rotateX(3deg) translateY(-3px); filter: drop-shadow(0 18px 22px rgba(30, 35, 70, .24)); }
        .avatar-blink { transform-box: fill-box; transform-origin: center; animation: avatar-blink 5.2s infinite; }
        .avatar-expression { transform-box: fill-box; transform-origin: center; animation: avatar-breathe 3.4s ease-in-out infinite; }
        .avatar-halo { transform-box: fill-box; transform-origin: center; animation: avatar-halo 2.8s ease-in-out infinite; }
        .avatar-pet { transform-box: fill-box; transform-origin: center; animation: avatar-pet-bob 2.2s ease-in-out infinite; }
        @keyframes avatar-blink { 0%, 44%, 48%, 86%, 90%, 100% { transform: scaleY(1); } 46%, 88% { transform: scaleY(.08); } }
        @keyframes avatar-breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1.5px) scale(1.015); } }
        @keyframes avatar-halo { 0%, 100% { opacity: .72; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
        @keyframes avatar-pet-bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(5deg); } }
        @media (prefers-reduced-motion: reduce) { .avatar-preview svg, .avatar-blink, .avatar-expression, .avatar-halo, .avatar-pet { animation: none !important; transition: none !important; } }

        @media (max-width: 700px) {
            .studio-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/compact-ui.css">
    <link rel="stylesheet" href="css/quality.css">
</head>

<body>

<header class="site-header">
    <nav class="navbar" aria-label="Điều hướng chính">
        <a href="index.html" class="logo">Connect<span>.</span></a>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Mở menu" aria-expanded="false">☰</button>
            <div class="nav-links" id="navLinks">
            <a href="index.html">Trang chủ</a>
            <a href="discover.html">Khám phá</a>
            <a href="profile.html">Hồ sơ cá nhân</a>
            <a href="avatar.html" aria-current="page">Tạo Avatar</a>
            <a href="icebreaker.html">Mini-games</a>
        </div>
        <div class="nav-actions">
            <button id="themeToggle" class="theme-btn" type="button" aria-label="Đổi giao diện">🌙</button>
            <div id="authArea" class="auth-area"></div>
        </div>
    </nav>
</header>

<main class="avatar-studio">

    <h1>Avatar Studio</h1>
    <p>Tự thiết kế nhân vật hoạt hình đại diện của bạn.</p>

    <div class="studio-content">

        <section class="avatar-preview">
            <h2>Xem trước Avatar</h2>

            <svg id="avatarCanvas"
                 viewBox="0 0 240 240"
                 xmlns="http://www.w3.org/2000/svg">

                <!-- Tóc phía sau -->
                <path id="backHair"
                      d="M65 95 Q55 20 120 25 Q185 20 175 95 L170 160 L70 160 Z"
                      fill="#30251f"/>

                <!-- Cổ -->
                <rect id="neck" x="105" y="155" width="30" height="40"
                      rx="10" fill="#f1c7a5"/>

                <!-- Thân và áo -->
                <path id="body"
                      d="M65 190 Q120 165 175 190 L200 285 L40 285 Z"
                      fill="#6c63ff"/>

                <!-- Khuôn mặt -->
                <path id="face"
                      d="M120 50 C65 50 65 90 70 125
                         C75 165 95 180 120 180
                         C145 180 165 165 170 125
                         C175 90 175 50 120 50 Z"
                      fill="#f1c7a5"/>

                <!-- Mắt -->
                <g id="avatarEyes" fill="#30251f">
                    <ellipse cx="100" cy="112" rx="5" ry="7"/>
                    <ellipse cx="140" cy="112" rx="5" ry="7"/>
                </g>

                <!-- Miệng -->
                <path id="avatarMouth"
                      d="M108 145 Q120 155 132 145"
                      stroke="#a34f4f"
                      stroke-width="3"
                      fill="none"
                      stroke-linecap="round"/>

                <!-- Tóc phía trước -->
                <path id="frontHair"
                      d="M68 95 Q75 35 120 45 Q165 35 172 95
                         Q150 70 130 80 Q100 60 68 95"
                      fill="#30251f"/>

            </svg>

            <p>Nhân vật hoạt hình của bạn</p>
        </section>

        <section class="avatar-options">

            <h2>Tùy chỉnh nhân vật</h2>

            <div id="optionsHost"></div>

            <div class="studio-actions">
                <button id="randomAvatar" class="random-avatar" type="button">🎲 Ngẫu nhiên</button>
                <button id="resetAvatar" class="secondary-avatar" type="button">↺ Mặc định</button>
                <button id="downloadAvatar" class="secondary-avatar" type="button">⬇ Tải PNG</button>
            </div>

            <button id="saveAvatar" class="save-avatar" type="button">
                Lưu Avatar
            </button>

            <p id="avatarMessage"></p>

        </section>

    </div>
</main>

<script type="module" src="js/session.js"></script>
<script src="js/script.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/avatar.js"></script>

  <script type="module" src="js/presence.js"></script>
</body>
</html>
